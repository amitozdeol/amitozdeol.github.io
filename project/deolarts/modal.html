<!-- Modal Section -->
<div id="paintingModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden">
    <div class="relative bg-white rounded-lg shadow-lg max-w-3xl w-full">
        <button class="absolute top-2 right-2 text-black text-xl" onclick="closeModal()">×</button>
        <div class="p-4">
            <img id="modalImage" src="" alt="Painting" class="w-full h-auto object-cover rounded-lg">
            <div class="flex justify-between mt-4">
                <button id="prevAngle" class="text-black bg-gray-200 px-4 py-2 rounded-lg"
                    onclick="prevImage()">Previous
                </button>
                <button id="nextAngle" class="text-black bg-gray-200 px-4 py-2 rounded-lg" onclick="nextImage()">Next
                </button>
            </div>
        </div>
    </div>
</div>
